name: markdown-render
version: 0.0.0.0
github: NorfairKing/markdown-render
synopsis: Build CommonMark documents as values and render them safely
description: ! 'Build a CommonMark document as a value, out of text that may contain
  anything, and render it with every character that would change its meaning escaped.


  For more info, see <https://github.com/NorfairKing/markdown-render the readme>.'
category: Text
author: Tom Sydney Kerckhove
maintainer: syd@cs-syd.eu
copyright: Copyright (c) 2026 Tom Sydney Kerckhove
license: AllRightsReserved
license-file: LICENSE

extra-source-files:
- LICENSE
- CHANGELOG.md

dependencies:
- base >= 4.7 && < 5

library:
  source-dirs: src/
  ghc-options:
  - -Wall
  - -Wincomplete-uni-patterns
  - -Wincomplete-record-updates
  - -Wpartial-fields
  - -Widentities
  - -Wredundant-constraints
  - -Wcpp-undef
  - -Wunused-packages
  dependencies:
  - bytestring
  - cmark
  - containers
  - text
  - validity
  - validity-text
